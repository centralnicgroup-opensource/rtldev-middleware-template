name: Quality
"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# LIVE workflow, and language-agnostic on purpose — it checks the things every
# repository has regardless of what it is written in: Markdown/JSON/YAML formatting,
# workflow syntax, and shell scripts.
#
# This is deliberately NOT the same file as examples/workflows/lint.yml, which delegates
# to the language-specific shared workflow. Different names so that copying that one into
# .github/workflows/ cannot silently overwrite this one — a repository wants both: the
# universal checks here, and its language's analysers there.
jobs:
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      # Gated, not advisory: unformatted Markdown should be a red build rather than a
      # local nag that everyone learns to ignore.
      - name: Check formatting
        run: npx --yes prettier@3 --check .

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-pr-check
          fail_level: error

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # `git ls-files` rather than `find`, for two reasons.
      #
      # It lints only *tracked* files, which keeps `env.sh` out. That file is
      # gitignored (see .gitignore) because it holds credentials for local testing,
      # and shellcheck echoes the offending source line for every finding — so
      # linting it means a syntax slip prints credential lines to the terminal. This
      # job is a bare checkout so the file never exists here, but the command is
      # meant to give the same answer when run locally in a populated working tree,
      # and that is exactly where it does exist.
      #
      # It also needs no prune list. The generated scripts that are not ours to lint
      # live in .husky/_/ (written by husky on install; its husky.sh has no shebang,
      # so it fails SC2148), node_modules/ and vendor/ — all three untracked, so
      # there is nothing to forget to exclude when a fourth one appears.
      #
      # .husky/pre-commit is named explicitly because it has no `.sh` extension.
      # -z | xargs -0 survives paths with spaces, and `--no-run-if-empty` makes
      # "this repository has no shell scripts" a pass instead of a shellcheck
      # invoked with no arguments (which exits 3 with a usage dump).
      #
      # Tradeoff accepted: a script that is present but not yet committed is not
      # linted, so the very first commit in a new repository lints nothing.
      - name: ShellCheck
        run: |
          git ls-files -z '*.sh' .husky/pre-commit \
            | xargs -0 --no-run-if-empty shellcheck --severity=warning
          echo "ShellCheck completed."

  ci-success:
    name: "Quality: completed"
    needs: [prettier, actionlint, shellcheck]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        # Two things here are load-bearing, and both were wrong before:
        #
        # Single quotes inside the expression, because GitHub expressions have no
        # double-quoted string literal — `join(needs.*.result, " ")` is not a style
        # slip but a syntax error, and it makes the whole file "Invalid workflow
        # file", so the gate never runs at all rather than running and passing.
        #
        # `tr` splits the space-joined results onto one line each. Against a single
        # line, `grep -vw success` selects nothing as long as the word appears
        # anywhere, so "success failure success" would report green — the one
        # outcome this job exists to catch.
        run: |
          if echo '${{ join(needs.*.result, ' ') }}' | tr ' ' '\n' | grep -qvw success; then
            echo "One or more quality jobs failed: ${{ join(needs.*.result, ' ') }}"
            exit 1
          fi

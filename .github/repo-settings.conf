# Desired GitHub repository settings.
#
# "Use this template" copies files, not settings — a new repository starts on GitHub's
# defaults. This file records what they should be; scripts/repo-settings.sh
# reconciles them.
#
#   pnpm repo:settings          # report drift, change nothing
#   pnpm repo:settings:apply    # make GitHub match this file
#
# Sourced as shell: quote values with spaces, booleans are bare true/false.
# Secret *values* are out of scope — only names, for the drift check.
#
# A value left as a {{TOKEN}} is a question nobody has answered yet. Check mode reports
# it as unconfigured and carries on, so the rest of the file is still verified; apply
# mode refuses outright rather than writing the literal token to GitHub.

# --- Identity ----------------------------------------------------------------
DESCRIPTION="{{DESCRIPTION}}"

# GitHub Pages URL, if this repository publishes docs. Empty otherwise.
HOMEPAGE=""

# Space-separated; lowercase, digits and hyphens only.
TOPICS="{{PROJECT_SLUG}} rtldev middleware"

# GitHub's "Template repository" checkbox — what puts the "Use this template" button on
# the repository page. It ships as true because this file ships from
# rtldev-middleware-template, where true is correct. A repository created from a template
# is not itself one, so set this false. Left alone it is reported as drift every Monday
# rather than applied silently, which is the intended reminder.
IS_TEMPLATE=true

# --- Merge behaviour ---------------------------------------------------------
# Squash merging off: it collapses the Conventional Commit messages semantic-release
# reads to pick the next version. Rebase keeps them.
ALLOW_SQUASH_MERGE=false
ALLOW_REBASE_MERGE=true
ALLOW_MERGE_COMMIT=false

# Safe only alongside required checks, which the ruleset sets.
ALLOW_AUTO_MERGE=true

DELETE_BRANCH_ON_MERGE=true

# --- Features ----------------------------------------------------------------
# Issues on: this template ships .github/ISSUE_TEMPLATE/, so turning them off would
# leave those unreachable. Set false only with no external reporters, and delete the
# templates in the same change.
HAS_ISSUES=true
HAS_PROJECTS=false
HAS_WIKI=false
HAS_DISCUSSIONS=false

# --- Security ----------------------------------------------------------------
# Private vulnerability reporting is what .github/SECURITY.md points at.
PRIVATE_VULNERABILITY_REPORTING=true
VULNERABILITY_ALERTS=true
AUTOMATED_SECURITY_FIXES=true
SECRET_SCANNING=true
SECRET_SCANNING_PUSH_PROTECTION=true

# --- Branch protection -------------------------------------------------------
# Prefer an organisation ruleset targeting rtldev-middleware-* — it covers repositories
# that do not exist yet. Set this true only if org rulesets are unavailable (they need
# Team or Enterprise Cloud); the script then manages a repository-level one.
# See TEMPLATE-SETUP.md section 8.
RULESET_ENABLED=false
RULESET_NAME="default-branch-protection"

# The ruleset targets the ~DEFAULT_BRANCH selector, not this name, so it follows a
# default-branch rename instead of breaking on one.
DEFAULT_BRANCH="{{DEFAULT_BRANCH}}"

REQUIRED_APPROVALS=1
DISMISS_STALE_REVIEWS=true
REQUIRE_LAST_PUSH_APPROVAL=true
REQUIRE_LINEAR_HISTORY=true

# Comma-separated job names. "Quality: completed" is quality.yml's aggregate, so adding
# a job to that workflow needs no change here.
REQUIRED_CHECKS="Quality: completed"

# --- Drift check only --------------------------------------------------------
# Space-separated names that must exist. Values are never read or written.
EXPECTED_SECRETS=""
EXPECTED_VARIABLES=""

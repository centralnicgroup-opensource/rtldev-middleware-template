# Drives the on-attach banner the devbase Feature prints. Sourced as shell, so
# quote values containing spaces.
#
# Every setting is optional, and every one is commented out here on purpose: the
# defaults are already correct for a fresh repository, so this file needs no edit
# to be right. Uncomment a line only to override.
#
# Deleting the file entirely is also fine — the defaults are what you get.

# Banner title. Left unset deliberately: the default is
# "<repository-directory> - development environment", which follows a repository
# rename instead of going stale after one.
# TITLE="My Project - development environment"

# Language groups. "auto" — the default for all of them — shows the group when
# its runtime is installed. Force with true, suppress with false. Suppressing is
# worth it when a runtime is present only as a build dependency and reporting it
# would be misleading.
# SHOW_PHP=auto
# SHOW_NODE=auto
# SHOW_GO=auto
# SHOW_PYTHON=auto
# SHOW_JAVA=auto

# PHP extensions to report, space-separated. Empty reports none.
# PHP_EXTENSIONS="curl intl xdebug"

# A note appended to the PHP row — for a constraint the version alone does not
# convey. php-sdk uses this for its language-feature ceiling.
# PHP_NOTE="(language-feature ceiling: 8.3)"

# Project dependencies worth seeing on attach, space-separated. Versions are read
# from node_modules / vendor, so an empty row means "install has not run" rather
# than "unknown".
# NODE_DEPS="prettier husky"
# COMPOSER_DEPS=""

# Anything the language groups do not cover. One "Label|command|field-index" per
# line; field-index picks a whitespace-separated field (1..3) and defaults to the
# whole first line of output.
# EXTRA_ROWS="Apache|apache2 -v|3
# MariaDB|mariadb --version|"
